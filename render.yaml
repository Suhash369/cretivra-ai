services:
  - type: web
    name: cretivra-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_MODEL
        value: cretivra-1
      - key: ENABLE_MOCK_OLLAMA
        value: "false"
