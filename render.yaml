services:
  - type: web
    name: cretivra-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_MODEL
        value: cretivra-1
      - key: ENABLE_MOCK_OLLAMA
        value: "false"
